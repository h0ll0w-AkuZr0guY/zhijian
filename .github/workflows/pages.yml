name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Include latest Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/downloads
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/zhijian-release.json; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'zhijian_*_x64-setup.exe' --dir dist/downloads
            python3 - <<'PY'
          import json, pathlib
          info=json.loads(pathlib.Path('/tmp/zhijian-release.json').read_text())
          files=list(pathlib.Path('dist/downloads').glob('*.exe'))
          if files:
              pathlib.Path('dist/downloads/desktop.json').write_text(json.dumps({'version':info['tagName'],'file':files[0].name}))
          PY
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
