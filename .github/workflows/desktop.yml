name: Windows desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '纸间 v__VERSION__'
          releaseBody: 'Windows 桌面版，支持托盘打开、隐藏、识别任务取消和退出。安装包包含离线 OCR 模型。'
          releaseDraft: false
          prerelease: false
      - name: Name the Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            if ($asset.name -like '*setup.exe') {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" -f "name=zhijian_${version}_x64-setup.exe" --silent
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: zhijian-windows
          path: |
            src-tauri/target/release/zhijian.exe
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Refresh the website download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo ${{ github.repository }}
