[package]
name = "zhijian"
version = "1.0.3"
description = "纸间 · 自由文档工作台"
authors = ["zhijian contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

